name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'AndroidApp/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./AndroidApp/package-lock.json

      - name: Install Dependencies
        working-directory: ./AndroidApp
        run: npm install

      - name: Update Version dynamically from github run number
        working-directory: ./AndroidApp
        run: |
          node -e "
            const fs = require('fs');
            const runNumber = '${{ github.run_number }}';
            const newVer = '1.0.' + runNumber;
            
            // 1. Update package.json
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = newVer;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('package.json version set to: ' + newVer);
            
            // 2. Update app.json
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.version = newVer;
            if (!app.expo.android) app.expo.android = {};
            app.expo.android.versionCode = parseInt(runNumber);
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
            console.log('app.json version set to: ' + newVer + ' (versionCode: ' + runNumber + ')');
          "

      - name: Create .env file from Secrets
        working-directory: ./AndroidApp
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env

      - name: Decode Keystore
        if: ${{ secrets.SIGNING_KEY != '' }}
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > AndroidApp/android/app/release.keystore

      - name: Build Release APK
        working-directory: ./AndroidApp/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          SIGNING_KEYSTORE_FILE: ${{ secrets.SIGNING_KEY != '' && 'release.keystore' || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare properly named APKs for release
        run: |
          mkdir -p AndroidApp/android/app/build/outputs/apk/release/upload
          cd AndroidApp/android/app/build/outputs/apk/release
          runNumber="${{ github.run_number }}"
          for f in *.apk; do
            if [ -f "$f" ]; then
              newName=$(echo "$f" | sed "s/app/ZeeshanHub_v1.0.${runNumber}/g" | sed "s/-release//g")
              cp "$f" "upload/$newName"
              echo "Prepared release copy: $newName"
            fi
          done

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: AndroidApp/android/app/build/outputs/apk/release/upload/*.apk
          name: "Zeeshan's App Hub v${{ github.run_number }}"
          tag_name: build-${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Hub Update
        continue-on-error: true
        working-directory: ./AndroidApp
        run: node scripts/publish_hub_update.js
        env:
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
